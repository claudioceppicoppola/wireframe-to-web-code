<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="enter your full name" required>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <fieldset>
          <legend>Choose Color</legend>
            <label><input type="radio" name="color" value="White">White</label>
            <label><input type="radio" name="color" value="Black">Black</label>
            <label><input type="radio" name="color" value="Grey">Grey</label>
        </fieldset>
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By CLAUDIO CEPPI</h2>
    </footer>
  </body>
</html>
